<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="츄라톡" />
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11151f" media="(prefers-color-scheme: dark)" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>츄라톡 ちゅらトーク</title>
  <link rel="stylesheet" href="style.css" />
</head>

  <header class="top">
    <a class="logo" href="#home"><img class="mark" src="icon-192.png" alt="" />츄라톡 <small>ちゅらトーク</small></a>
    <div class="chips">
      <span class="chip fire" id="streak">0</span>
      <span class="chip gem" id="xp">0</span>
      <button class="chip conn" id="status" aria-label="연결 상태"><i></i></button>
    </div>

  <main id="view"></main>

  <nav class="tabs" id="tabs"></nav>

  <div id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="icons.js"></script>
  <script src="curriculum.js"></script>
