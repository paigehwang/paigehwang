<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="츄라톡" />
  <meta name="theme-color" content="#f4f8f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1a1c" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>츄라톡 ちゅらトーク</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <a class="logo" href="#home">츄라톡 <small>ちゅらトーク</small></a>
    <div class="chips">
      <span class="chip fire" id="streak">🔥 0</span>
      <span class="chip gem" id="xp">💎 0</span>
      <button class="chip conn" id="status" aria-label="연결 상태"><i></i></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-tab="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>회화</button>
    <button data-tab="speak" class="center"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>말하기</button>
    <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>복습</button>
    <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>표현집</button>
  </nav>

  <div id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="curriculum.js"></script>
  <script src="kana.js"></script>
  <script src="app.js"></script>
</body>
</html>
